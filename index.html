<script>
    // 1. 배경음악 설정 및 재생
    const bgm = new Audio('bgm.mp3');
    bgm.loop = true;
    window.addEventListener('click', () => {
        bgm.play();
    }, { once: true });

    // 2. 나가기 버튼 기능 추가
    window.addEventListener('DOMContentLoaded', () => {
        const exitBtn = document.querySelector('button'); 
        if (exitBtn) {
            exitBtn.addEventListener('click', (e) => {
                alert('로비로 나갑니다!');
                location.reload(); 
            });
        }
    });
</script>
