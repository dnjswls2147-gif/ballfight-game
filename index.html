<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        body {
            background-color: #f0f3f6;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .hidden { display: none !important; }
        h2 { color: #2c3e50; margin-bottom: 15px; font-size: 20px; }
        .desc { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: left !important;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        input[type="text"]::placeholder {
            text-align: left !important;
        }
        input[type="text"]:focus { 
            border-color: #2ecc71; 
        }
        
        .error {
            height: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-ai { background-color: #2ecc71; }
        .btn-friend { background-color: #3498db; }
        .btn-create { background-color: #9b59b6; font-size: 14px; padding: 10px; }
        .btn-join { background-color: #e67e22; font-size: 14px; padding: 10px; }
        .btn-back { background-color: #95a5a6; font-size: 13px; padding: 8px; }
        
        .room-box {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        canvas {
            background: #ffffff;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            display: block;
            margin: 0 auto 10px auto;
        }
        
        /* 네모나고 더 커진 체력바 스타일 */
        .hp-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border: 2.5px solid #2c3e50;
            border-radius: 0px; 
            overflow: hidden;
            margin-bottom: 8px;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background-color: #3498db; /* 내 팀(파란색) */
            transition: width 0.1s;
            border-radius: 0px;
        }
        .hp-fill.p2 { background-color: #e74c3c; /* 상대 팀(빨간색) */ }
        .label { font-size: 12px; font-weight: bold; text-align: left; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- 1. 메인 로비 -->
    <div class="container" id="lobby-screen">
        <h2>🎮 릴리 볼 파이트 🎮</h2>
        <div class="desc">플레이어 이름을 입력하세요!</div>
        <div class="error" id="error-msg"></div>
        <input type="text" id="username" placeholder="이름을 입력하세요" maxlength="10">
        <button class="btn btn-ai" onclick="startAI()">AI 자동 매칭</button>
        <button class="btn btn-friend" onclick="showFriendMenu()">친구 플레이</button>
    </div>

    <!-- 1-1. 친구 플레이 메뉴 -->
    <div class="container hidden" id="friend-screen">
        <h2>👥 친구 플레이 👥</h2>
        <div class="desc">방을 생성하거나 번호를 입력하세요</div>
        <div class="error" id="friend-error"></div>
        
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn btn-create" style="margin-top:0; flex:1;" onclick="createRoom()">방 생성하기 (랜덤 4자리)</button>
