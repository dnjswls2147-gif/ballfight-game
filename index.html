<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        body {
            background-color: #f0f3f6;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .hidden { display: none !important; }
        h2 { color: #2c3e50; margin-bottom: 15px; font-size: 20px; }
        .desc { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: center;
            margin-bottom: 10px;
        }
        input:focus { border-color: #2ecc71; }
        .error {
            height: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-ai { background-color: #2ecc71; }
        .btn-friend { background-color: #3498db; }
        .btn-create { background-color: #9b59b6; font-size: 14px; padding: 10px; }
        .btn-join { background-color: #e67e22; font-size: 14px; padding: 10px; }
        .btn-back { background-color: #95a5a6; font-size: 13px; padding: 8px; }
        
        .room-box {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        canvas {
            background: #ffffff;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            display: block;
            margin: 0 auto 10px auto;
        }
        .hp-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            border: 2px solid #2c3e50;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background-color: #e74c3c;
            transition: width 0.1s;
        }
        .hp-fill.p2 { background-color: #3498db; }
        .label { font-size: 12px; font-weight: bold; text-align: left; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- 1. 메인 로비 -->
    <div class="container" id="lobby-screen">
        <h2>🎮 릴리 볼 파이트 🎮</h2>
        <div class="desc">플레이어 이름을 입력하세요!</div>
        <div class="error" id="error-msg"></div>
        <input type="text" id="username" placeholder="이름을 입력하세요" maxlength="10">
        <button class="btn btn-ai" onclick="startAI()">AI 자동 매칭</button>
        <button class="btn btn-friend" onclick="showFriendMenu()">친구 플레이</button>
    </div>

    <!-- 1-1. 친구 플레이 메뉴 -->
    <div class="container hidden" id="friend-screen">
        <h2>👥 친구 플레이 👥</h2>
        <div class="desc">방을 생성하거나 번호를 입력하세요</div>
        <div class="error" id="friend-error"></div>
        
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn btn-create" style="margin-top:0; flex:1;" onclick="createRoom()">방 생성하기 (랜덤 4자리)</button>
            <button class="btn" style="margin-top:0; width:40px; background:#e74c3c;" onclick="resetRoom()">X</button>
        </div>
        <div class="room-box hidden" id="room-display">----</div>

        <input type="text" id="room-input" placeholder="방 번호 4자리 입력" maxlength="4">
        <button class="btn btn-join" onclick="joinRoom()">방 번호로 시작하기</button>
        <button class="btn btn-back" onclick="showLobby()">뒤로 가기</button>
    </div>

    <!-- 2. 게임 화면 -->
    <div class="container hidden" id="game-screen">
        <canvas id="gameCanvas" width="280" height="280"></canvas>
        <div class="label" id="p1-label" style="color: #e74c3c;">Player 1 (레드)</div>
        <div class="hp-bar"><div class="hp-fill" id="p1-hp"></div></div>
        <div class="label" id="p2-label" style="color: #3498db;">Player 2 (블루)</div>
        <div class="hp-bar"><div class="hp-fill p2" id="p2-hp"></div></div>
        <button class="btn hidden" id="lobby-back-btn" onclick="showLobby()" style="background:#e67e22; margin-top:10px;">🏠 로비로 가기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;
        let createdCode = null;

        let p1 = { x: 70, y: 140, radius: 12, color: '#e74c3c', vx: 4, vy: 3, hp: 100, maxHp: 100 };
        let p2 = { x: 210, y: 140, radius: 12, color: '#3498db', vx: -4, vy: -3, hp: 100, maxHp: 100 };

        function validateName() {
            const name = document.getElementById('username').value.trim();
            if (!name) {
                document.getElementById('error-msg').innerText = "이름부터 써주세요!";
                document.getElementById('friend-error').innerText = "이름부터 써주세요!";
                return null;
            }
            document.getElementById('error-msg').innerText = "";
            document.getElementById('friend-error').innerText = "";
            return name;
        }

        function startAI() {
            const name = validateName();
            if (!name) return;

            document.getElementById('p1-label').innerText = name + " (레드)";
            document.getElementById('p2-label').innerText = "AI 봇 (블루)";
            document.getElementById('lobby-back-btn').classList.remove('hidden');

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            gameStarted = true;
            requestAnimationFrame(loop);
        }

        function showFriendMenu() {
            const name = validateName();
            if (!name) return;

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('friend-screen').classList.remove('hidden');
        }

        function showLobby() {
            gameStarted = false;
            resetGameState();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('friend-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        function createRoom() {
            createdCode = Math.floor(1000 + Math.random() * 9000).toString();
            const box = document.getElementById('room-display');
            box.innerText = "방 번호: " + createdCode;
            box.classList.remove('hidden');
            document.getElementById('friend-error').innerText = "";
        }

        function resetRoom() {
            createdCode = null;
            document.getElementById('room-display').classList.add('hidden');
            document.getElementById('room-input').value = "";
            document.getElementById('friend-error').innerText = "방이 초기화되었습니다.";
        }

        function joinRoom() {
            const name = validateName();
            if (!name) return;

            const code = document.getElementById('room-input').value.trim();
            const err = document.getElementById('friend-error');

            if (code.length !== 4) {
                err.innerText = "4자리 방 번호를 입력하세요!";
                return;
            }
            if (!createdCode) {
                err.innerText = "방을 먼저 생성해주세요!";
                return;
            }
            if (code === createdCode) {
                err.innerText = "자신과 대결할 수 없습니다";
                return;
            }
            if (code !== createdCode) {
                err.innerText = "비번이 틀렸습니다";
                return;
            }

            err.innerText = "";
            document.getElementById('p1-label').innerText = name + " (레드)";
            document.getElementById('p2-label').innerText = "친구 (블루)";
            document.getElementById('lobby-back-btn').classList.add('hidden');

            document.getElementById('friend-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            gameStarted = true;
            requestAnimationFrame(loop);
        }

        function resetGameState() {
            p1.hp = 100; p2.hp = 100;
            p1.x = 70; p1.y = 140; p1.vx = 4; p1.vy = 3;
            p2.x = 210; p2.y = 140; p2.vx = -4; p2.vy = -3;
            document.getElementById('p1-hp').style.width = '100%';
            document.getElementById('p2-hp').style.width = '100%';
        }

        function update() {
            if (!gameStarted) return;

            p1.x += p1.vx; p1.y += p1.vy;
            p2.x += p2.vx; p2.y += p2.vy;

            if (p1.x - p1.radius < 0 || p1.x + p1.radius > canvas.width) p1.vx *= -1;
            if (p1.y - p1.radius < 0 || p1.y + p1.radius > canvas.height) p1.vy *= -1;

            if (p2.x - p2.radius < 0 || p2.x + p2.radius > canvas.width) p2.vx *= -1;
            if (p2.y - p2.radius < 0 || p2.y + p2.radius > canvas.height) p2.vy *= -1;

            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < p1.radius + p2.radius) {
                let tempVx = p1.vx; let tempVy = p1.vy;
                p1.vx = p2.vx; p1.vy = p2.vy;
                p2.vx = tempVx; p2.vy = tempVy;

                let overlap = (p1.radius + p2.radius) - dist;
                let nx = dx / (dist || 1);
                let ny = dy / (dist || 1);
                p1.x -= nx * overlap / 2;
                p1.y -= ny * overlap / 2;
                p2.x += nx * overlap / 2;
                p2.y += ny * overlap / 2;

                p1.hp = Math.max(0, p1.hp - 10);
                p2.hp = Math.max(0, p2.hp - 10);

                document.getElementById('p1-hp').style.width = (p1.hp / p1.maxHp * 100) + '%';
                document.getElementById('p2-hp').style.width = (p2.hp / p2.maxHp * 100) + '%';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
            ctx.fillStyle = p1.color;
            ctx.fill();
            ctx.closePath();

            ctx.beginPath();
            ctx.arc(p2.x, p2.y, p2.radius, 0, Math.PI * 2);
            ctx.fillStyle = p2.color;
            ctx.fill();
            ctx.closePath();
        }

        function loop() {
            if (!gameStarted) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
