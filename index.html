<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공싸움 게임 로비</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #333;
            box-sizing: border-box;
            padding-bottom: 30px;
        }

        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }

        .lobby-box {
            position: relative;
            width: 340px;
            height: 380px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .start-btn {
            width: 340px;
            padding: 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #27ae60;
            margin-top: 25px;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #27ae60;
        }

        #game-screen {
            background-color: #111;
            color: white;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            width: 380px;
            height: 380px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .ui-container {
            width: 380px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-status {
            background: #222;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .player-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .hp-bar-bg {
            width: 100%;
            height: 12px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
        }
        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s ease;
        }
        #p1-hp { background: #2ecc71; }
        #p2-hp { background: #e74c3c; }
        #exit-btn {
            margin-top: 10px;
            width: 380px;
            padding: 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #c0392b;
        }
        #exit-btn:active {
            box-shadow: 0 2px #c0392b;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <!-- 로비 화면 -->
    <div id="lobby-screen" class="screen">
        <div style="height: 40px;"></div>
        <div class="lobby-box"></div>
        <button id="start-btn" class="start-btn">시작하기 ▶</button>
    </div>

    <!-- 게임 플레이 화면 -->
    <div id="game-screen" class="screen hidden">
        <div id="game-container">
            <canvas id="gameCanvas" width="380" height="380"></canvas>
        </div>

        <div class="ui-container">
            <div class="player-status">
                <div class="player-name">
                    <span style="color: #3498db;">어둠속성 김켈리</span>
                    <span id="p1-hp-text">250 / 250</span>
                </div>
                <div class="hp-bar-bg">
                    <div id="p1-hp" class="hp-bar-fill"></div>
                </div>
            </div>

            <div class="player-status">
                <div class="player-name">
                    <span style="color: #e74c3c;">백기철 판타지</span>
                    <span id="p2-hp-text">250 / 250</span>
                </div>
                <div class="hp-bar-bg">
                    <div id="p2-hp" class="hp-bar-fill"></div>
                </div>
            </div>
        </div>

        <button id="exit-btn">나가기 🚪</button>
    </div>
