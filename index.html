<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        body {
            background-color: #f0f3f6;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }
        .hidden { display: none !important; }
        h2 { color: #2c3e50; margin-bottom: 15px; font-size: 20px; }
        .desc { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: left !important;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: #fff;
        }
        input[type="text"]::placeholder {
            text-align: left !important;
        }
        input[type="text"]:focus { 
            border-color: #2ecc71; 
        }
        
        .error {
            height: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-ai { background-color: #2ecc71; }
        .btn-friend { background-color: #3498db; }
        .btn-create { background-color: #9b59b6; font-size: 14px; padding: 10px; }
        .btn-join { background-color: #e67e22; font-size: 14px; padding: 10px; }
        .btn-back { background-color: #95a5a6; font-size: 13px; padding: 8px; }
        
        .room-box {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        canvas {
            background: #ffffff;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            display: block;
            margin: 0 auto 10px auto;
        }
        
        .hp-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border: 2.5px solid #2c3e50;
            border-radius: 0px; 
            overflow: hidden;
            margin-bottom: 8px;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background-color: #3498db;
            transition: width 0.1s;
            border-radius: 0px;
        }
        .hp-fill.p2 { background-color: #e74c3c; }
        .label { font-size: 12px; font-weight: bold; text-align: left; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- 1. 메인 로비 -->
    <div class="container" id="lobby-screen">
        <h2>🎮 릴리 볼 파이트 🎮</h2>
        <div class="desc">플레이어 이름을 입력하세요!</div>
        <div class="error" id="error-msg"></div>
        <input type="text" id="username" placeholder="이름을 입력하세요" maxlength="10">
        <button class="btn btn-ai" id="ai-btn">AI 자동 매칭</button>
        <button class="btn btn-friend" id="friend-btn">친구 플레이</button>
    </div>

    <!-- 1-1. 친구 플레이 메뉴 -->
    <div class="container hidden" id="friend-screen">
        <h2>👥 친구 플레이 👥</h2>
        <div class="desc">방을 생성하거나 번호를 입력하세요</div>
        <div class="error" id="friend-error"></div>
        
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn btn-create" style="margin-top:0; flex:1;" id="create-room-btn">방 생성하기 (랜덤 4자리)</button>
            <button class="btn" style="margin-top:0; width:40px; background:#e74c3c;" id="reset-room-btn">X</button>
        </div>
        <div class="room-box hidden" id="room-display">----</div>

        <input type="text" id="room-input" placeholder="방 번호 4자리 입력" maxlength="4">
        <button class="btn btn-join" id="join-room-btn">방 번호로 시작하기</button>
        <button class="btn btn-back" id="back-lobby-btn">뒤로 가기</button>
    </div>

    <!-- 2. 게임 화면 -->
    <div class="container hidden" id="game-screen">
        <canvas id="gameCanvas" width="340" height="340"></canvas>
        <div class="label" id="p1-label" style="color: #3498db;">Player 1 (블루)</div>
        <div class="hp-bar"><div class="hp-fill" id="p1-hp"></div></div>
        <div class="label" id="p2-label" style="color: #e74c3c;">Player 2 (레드)</div>
        <div class="hp-bar"><div class="hp-fill p2" id="p2-hp"></div></div>
        <button class="btn hidden" id="lobby-back-btn" style="background:#e67e22; margin-top:10px;">🏠 로비로 가기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;
        let createdCode = null;

        let p1 = { x: 85, y: 170, radius: 24, color: '#3498db', vx: 2.2, vy: 1.6, hp: 250, maxHp: 250 };
        let p2 = { x: 25
