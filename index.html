<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #f0f3f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        .screen {
            width: 100%;
            max-width: 360px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hidden { display: none !important; }
        .welcome-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            text-align: center;
        }
        .lobby-box {
            width: 100%;
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .lobby-desc {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
            text-align: center;
        }
        .name-input {
            width: 100%;
            padding: 9px;
            font-size: 14px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: center;
            margin-bottom: 6px;
        }
        .name-input:focus {
            border-color: #2ecc71;
        }
