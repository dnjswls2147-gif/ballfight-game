<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        body {
            background-color: #f0f3f6;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }
        .hidden { display: none !important; }
        h2 { color: #2c3e50; margin-bottom: 10px; font-size: 20px; }
        .desc { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
        
        .coin-box {
            display: inline-flex;
            align-items: center;
            background: #fef9e7;
            border: 2px solid #f1c40f;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            color: #d68910;
            margin-bottom: 15px;
        }
        .coin-icon {
            width: 18px;
            height: 18px;
            background: #f1c40f;
            border: 2px solid #d68910;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            text-align: center;
            line-height: 14px;
            font-size: 11px;
            color: #fff;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: left !important;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: #fff;
        }
        input[type="text"]::placeholder {
            text-align: left !important;
        }
        input[type="text"]:focus { 
            border-color: #2ecc71; 
        }
        
        .error {
            height: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-ai { background-color: #2ecc71; }
        .btn-friend { background-color: #3498db; }
        .btn-create { background-color: #9b59b6; font-size: 14px; padding: 10px; }
        .btn-join { background-color: #e67e22; font-size: 14px; padding: 10px; }
        .btn-back { background-color: #95a5a6; font-size: 13px; padding: 8px; }
        
        .char-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .char-card {
            flex: 1;
            border: 3px solid #bdc3c7;
            border-radius: 10px;
            padding: 15px 10px;
            cursor: pointer;
            background: #f8f9fa;
            transition: 0.2s;
        }
        .char-card.selected {
            border-color: #3498db;
            background: #ebf5fb;
        }
        .char-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #2c3e50; }
        .char-desc { font-size: 11px; color: #7f8c8d; }
        
        .timer-box {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .room-box {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        /* 경기장 캔버스 컨테이너 및 2배속 버튼 */
        .canvas-container {
            position: relative;
            width: 340px;
            margin: 0 auto 10px auto;
        }
        canvas {
            background: #ffffff;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            display: block;
        }
        .speed-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            background: #e67e22;
            color: white;
            border: 2px solid #d35400;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .speed-btn.active {
            background: #e74c3c;
            border-color: #c0392b;
        }
        
        .hp-bar {
            position: relative;
            width: 100%;
            height: 22px;
            background: #e0e0e0;
            border: 2.5px solid #2c3e50;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .hp-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-color: #3498db;
            transition: width 0.1s;
        }
        .hp-fill.p2 { background-color: #e74c3c; }
        
        .hp-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            z-index: 5;
            pointer-events: none;
        }

        .label { font-size: 12px; font-weight: bold; text-align: left; margin-bottom: 2px; }
        
        .result-box {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            padding: 8px;
            border-radius: 8px;
        }
        .result-win { background: #d4edda; color: #155724; }
        .result-lose { background: #f8d7da; color: #721c24; }
        .result-draw { background: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

    <!-- 1. 메인 로비 -->
    <div class="container" id="lobby-screen">
        <h2>🎮 릴리 볼 파이트 🎮</h2>
        <div class="coin-box"><span class="coin-icon">C</span> 코인: <span id="coin-count">0</span>개</div>
        <div class="desc">플레이어 이름을 입력하세요!</div>
        <div class="error" id="error-msg"></div>
        <input type="text" id="username" placeholder="이름을 입력하세요" maxlength="10">
        <button class="btn btn-ai" onclick="startAI()">AI 자동 매칭</button>
        <button class="btn btn-friend" onclick="showFriendMenu()">친구 플레이</button>
    </div>

    <!-- 1-1. 친구 플레이 메뉴 -->
    <div class="container hidden" id="friend-screen">
        <h2>👥 친구 플레이 👥</h2>
        <div class="coin-box"><span class="coin-icon">C</span> 코인: <span id="coin-count-friend">0</span>개</div>
        <div class="desc">방을 생성하거나 번호를 입력하세요</div>
        <div class="error" id="friend-error"></div>
        
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn btn-create" style="margin-top:0; flex:1;" onclick="createRoom()">방 생성하기 (랜덤 4자리)</button>
            <button class="btn" style="margin-top:0; width:40px; background:#e74c3c;" onclick="resetRoom()">X</button>
        </div>
        <div class="room-box hidden" id="room-display">----</div>

        <input type="text" id="room-input" placeholder="방 번호 4자리 입력" maxlength="4">
        <button class="btn btn-join" onclick="joinRoom()">방 번호로 시작하기</button>
        <button class="btn btn-back" onclick="showLobby()">뒤로 가기</button>
    </div>

    <!-- 1-2. 캐릭터 선택 화면 (10초 타이머) -->
    <div class="container hidden" id="char-select-screen">
        <h2>⚔️ 캐릭터 선택 ⚔️</h2>
        <div class="timer-box" id="timer-display">10초</div>
        <div class="desc">마음에 드는 캐릭터를 선택하세요!</div>
        
        <div class="char-grid">
            <div class="char-card selected" id="card-standard" onclick="selectCharacter('standard')">
                <div class="char-title">스탠다드 볼</div>
                <div class="char-desc">균형 잡힌 표준형 볼</div>
            </div>
            <div class="char-card" id="card-speed" onclick="selectCharacter('speed')">
                <div class="char-title">스피드 볼</div>
                <div class="char-desc">빠르고 날렵한 볼</div>
            </div>
        </div>
        
        <button class="btn btn-ai" onclick="confirmCharacterSelection()">선택 완료 및 게임 시작</button>
    </div>

    <!-- 2. 게임 화면 -->
    <div class="container hidden" id="game-screen">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="340" height="340"></canvas>
            <button class="speed-btn" id="speed-toggle-btn" onclick="toggleSpeed()">⚡ 2X 배속</button>
        </div>
        
        <div class="label" id="p1-label" style="color: #3498db;">Player 1 (블루)</div>
        <div class="hp-bar">
            <div class="hp-fill" id="p1-hp"></div>
            <div class="hp-text" id="p1-hp-text">250 / 250</div>
        </div>

        <div class="label" id="p2-label" style="color: #e74c3c;">Player 2 (레드)</div>
        <div class="hp-bar">
            <div class="hp-fill p2" id="p2-hp"></div>
            <div class="hp-text" id="p2-hp-text">250 / 250</div>
        </div>

        <div id="game-result-box" class="result-box hidden"></div>

        <button class="btn hidden" id="lobby-back-btn" onclick="showLobby()" style="background:#e67e22; margin-top:10px;">🏠 로비로 가기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;
        let createdCode = null;
        let selectedCharType = 'standard';
        let remainingTime = 10;
        let timerInterval = null;
        let nextGameMode = 'ai';
        let userCoins = 0;
        let isDoubleSpeed = false;
        let speedMultiplier = 1;

        let p1 = { x: 85, y: 170, radius: 24, color: '#3498db', vx: 2.2, vy: 1.6, hp: 250, maxHp: 250 };
        let p2 = { x: 255, y: 170, radius: 24, color: '#e74c3c', vx: -2.2, vy: -1.6, hp: 250, maxHp: 250 };

        function updateCoinsUI() {
            document.getElementById('coin-count').innerText = userCoins;
            document.getElementById('coin-count-friend').innerText = userCoins;
        }

        function validateName() {
            document.activeElement.blur();
            const name = document.getElementById('username').value.trim();
            if (!name) {
                document.getElementById('error-msg').innerText = "이름부터 써주세요!";
                document.getElementById('friend-error').innerText = "이름부터 써주세요!";
                return null;
            }
            document.getElementById('error-msg').innerText = "";
            document.getElementById('friend-error').innerText = "";
            return name;
        }

        function startAI() {
            const name = validateName();
            if (!name) return;
            nextGameMode = 'ai';
            showCharacterSelect();
        }

        function joinRoomMatch() {
            const name = validateName();
            if (!name) return;

            const code = document.getElementById('room-input').value.trim();
            const err = document.getElementById('friend-error');

            if (code.length !== 4) {
                err.innerText = "4자리 방 번호를 입력하세요!";
                return;
            }
            if (!createdCode) {
                err.innerText = "방을 먼저 생성해주세요!";
                return;
            }
            if (code === createdCode) {
                err.innerText = "자신과 대결할 수 없습니다";
                return;
            }
            if (code !== createdCode) {
                err.innerText = "비번이 틀렸습니다";
                return;
            }

            err.innerText = "";
            nextGameMode = 'friend';
            showCharacterSelect();
        }

        function showCharacterSelect() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('friend-screen').classList.add('hidden');
            document.getElementById('char-select-screen').classList.remove('hidden');

            remainingTime = 10;
            document.getElementById('timer-display').innerText = remainingTime + "초";
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingTime--;
                document.getElementById('timer-display').innerText = remainingTime + "초";
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    confirmCharacterSelection();
                }
            }, 1000);
        }

        function selectCharacter(type) {
            selectedCharType = type;
            document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected'));
            if (type === 'standard') {
                document.getElementById('card-standard').classList.add('selected');
            } else {
                document.getElementById('card-speed').classList.add('selected');
            }
        }

        function confirmCharacterSelection() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            const name = document.getElementById('username').value.trim();
            document.getElementById('p1-label').innerText = name + " (블루)";

            if (nextGameMode === 'ai') {
                document.getElementById('p2-label').innerText = "AI 봇 (레드)";
            } else {
                document.getElementById('p2-label').innerText = "친구 (레드)";
            }

            resetGameState();
            gameStarted = true;
            requestAnimationFrame(loop);
        }

        function toggleSpeed() {
            if (!gameStarted) return;

            if (nextGameMode === 'friend') {
                // 친구 플레이 시 상대방 승인 팝업
                const confirmChoice = confirm("⚡ 친구에게 2배속 요청이 들어왔습니다.\n승인하시겠습니까?");
                if (!confirmChoice) {
                    alert("2배속 요청이 거절되었습니다.");
                    return;
                }
            }

            isDoubleSpeed = !isDoubleSpeed;
            const btn = document.getElementById('speed-toggle-btn');

            if (isDoubleSpeed) {
                speedMultiplier = 2;
                btn.innerText = "⚡ 2X 온 (ON)";
                btn.classList.add('active');
            } else {
                speedMultiplier = 1;
                btn.innerText = "⚡ 2X 배속";
                btn.classList.remove('active');
            }
        }

        function showFriendMenu() {
            const name = validateName();
            if (!name) return;

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('friend-screen').classList.remove('hidden');
        }

        function showLobby() {
            if (timerInterval) clearInterval(timerInterval);
            gameStarted = false;
            resetGameState();
            updateCoinsUI();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('friend-screen').classList.add('hidden');
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        function createRoom() {
            document.activeElement.blur();
            createdCode = Math.floor(1000 + Math.random() * 9000).toString();
            const box = document.getElementById('room-display');
            box.innerText = "방 번호: " + createdCode;
            box.classList.remove('hidden');
            document.getElementById('friend-error').innerText = "";
        }

        function resetRoom() {
            document.activeElement.blur();
            createdCode = null;
            document.getElementById('room-display').classList.add('hidden');
            document.getElementById('room-input').value = "";
            document.getElementById('friend-error').innerText = "방이 초기화되었습니다.";
        }

        function joinRoom() {
            joinRoomMatch();
        }

        function resetGameState() {
            p1.hp = 250; p2.hp = 250;
            p1.x = 85; p1.y = 170; 
            
            let baseSpeedX = (selectedCharType === 'speed') ? 3.2 : 2.2;
            let baseSpeedY = (selectedCharType === 'speed') ? 2.4 : 1.6;

            p1.vx = baseSpeedX; p1.vy = baseSpeedY;
            p2.x = 255; p2.y = 170; p2.vx = -2.2; p2.vy = -1.6;
            
            isDoubleSpeed = false;
            speedMultiplier = 1;
            const btn = document.getElementById('speed-toggle-btn');
            btn.innerText = "⚡ 2X 배속";
            btn.classList.remove('active');

            document.getElementById('p1-hp').style.width = '100%';
            document.getElementById('p2-hp').style.width = '100%';
            document.getElementById('p1-hp-text').innerText = "250 / 250";
            document.getElementById('p2-hp-text').innerText = "250 / 250";
            
            const resBox = document.getElementById('game-result-box');
            resBox.className = "result-box hidden";
            resBox.innerText = "";
            document.getElementById('lobby-back-btn').classList.add('hidden');
        }

        function checkGameOver() {
            if (p1.hp <= 0 || p2.hp <= 0) {
                gameStarted = false;
                const resBox = document.getElementById('game-result-box');
                resBox.classList.remove('hidden');

                if (p1.hp > 0 && p2.hp <= 0) {
                    // 내 팀 승리 -> 1코인 획득
                    userCoins += 1;
                    updateCoinsUI();
                    resBox.className = "result-box result-win";
                    resBox.innerText = "🎉 승리! (+1 코인 획득!)";
                } else if (p1.hp <= 0 && p2.hp > 0
