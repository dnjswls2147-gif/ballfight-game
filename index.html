<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        body {
            background-color: #2c163a;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #fff8e8;
            border: 3px solid #e67e22;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h2 { color: #d35400; margin-bottom: 2px; font-size: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .version-text { font-size: 11px; color: #7f8c8d; margin-bottom: 10px; font-weight: bold; }
        .desc { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
        
        .currency-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .coin-box {
            display: inline-flex;
            align-items: center;
            background: #fef9e7;
            border: 2px solid #f1c40f;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            color: #d68910;
        }
        .trophy-box {
            display: inline-flex;
            align-items: center;
            background: #eef9ff;
            border: 2px solid #3498db;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            color: #2980b9;
        }
        .myball-btn-box {
            display: inline-flex;
            align-items: center;
            background: #f3e5f5;
            border: 2px solid #9b59b6;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            color: #8e44ad;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-icon {
            width: 16px;
            height: 16px;
            background: #f1c40f;
            border: 2px solid #d68910;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            text-align: center;
            line-height: 12px;
            font-size: 10px;
            color: #fff;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: left !important;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: #fff;
        }
        input[type="text"]:focus { 
            border-color: #e67e22; 
        }
        
        .error {
            height: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            pointer-events: auto !important;
            position: relative;
            z-index: 20;
        }
        .btn-ai { background-color: #27ae60; }
        .btn-friend { background-color: #2980b9; }
        .btn-create { background-color: #8e44ad; font-size: 14px; padding: 10px; }
        .btn-join { background-color: #d35400; font-size: 14px; padding: 10px; }
        .btn-back { background-color: #7f8c8d; font-size: 13px; padding: 8px; }
        
        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            padding: 10px 15px;
        }
        .shop-item.owned { border-color: #27ae60; background: #eafaf1; }
        .shop-item.equipped { border-color: #2980b9; background: #ebf5fb; }
        .shop-info { text-align: left; }
        .shop-name { font-weight: bold; font-size: 14px; color: #2c3e50; }
        .shop-desc { font-size: 11px; color: #7f8c8d; }
        .shop-action-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto !important;
        }
        .btn-buy { background-color: #d35400; }
        .btn-select { background-color: #2980b9; }
        .btn-equipped { background-color: #27ae60; cursor: default; }

        .timer-box {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .room-box {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        .canvas-container {
            position: relative;
            width: 340px;
            margin: 0 auto 10px auto;
        }
        canvas {
            background: #ffffff;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            display: block;
        }
        .speed-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            background: #d35400;
            color: white;
            border: 2px solid #a04000;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            touch-action: manipulation;
            pointer-events: auto !important;
        }
        .speed-btn.active {
            background: #c0392b;
            border-color: #962d22;
        }
        
        .hp-bar {
            position: relative;
            width: 100%;
            height: 22px;
            background: #e0e0e0;
            border: 2.5px solid #2c3e50;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .hp-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-color: #2980b9;
            transition: width 0.1s;
        }
        .hp-fill.p2 { background-color: #c0392b; }
        
        .hp-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            z-index: 5;
            pointer-events: none;
        }

        .label { font-size: 12px; font-weight: bold; text-align: left; margin-bottom: 2px; }
        
        .result-box {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            padding: 8px;
            border-radius: 8px;
        }
        .result-win { background: #d4edda; color: #155724; }
        .result-lose { background: #f8d7da; color: #721c24; }
        .result-draw { background: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

    <!-- 1. 메인 로비 -->
    <div class="container" id="lobby-screen">
        <h2>🎃 릴리 볼 파이트 🎃</h2>
        <div class="version-text">v1.1 버전</div>
        <div class="currency-container">
            <div class="coin-box"><span class="coin-icon">C</span> 코인: <span id="coin-count">0</span>개</div>
            <div class="trophy-box">🏆 트로피: <span id="trophy-count">0</span>개</div>
            <div class="myball-btn-box" id="btn-open-myball">⚽ 나의 공</div>
        </div>
        <div class="desc">플레이어 이름을 입력하세요!</div>
        <div class="error" id="error-msg"></div>
        <input type="text" id="username" placeholder="이름을 입력하세요 (최대 10글자)">
        <button class="btn btn-ai" id="btn-ai-match">AI 자동 매칭</button>
        <button class="btn btn-friend" id="btn-friend-play">친구 플레이</button>
    </div>

    <!-- 1-0. 나의 공 상점 및 보관함 화면 -->
    <div class="container hidden" id="myball-screen">
        <h2>⚽ 나의 공 보관함 ⚽</h2>
        <div class="version-text">v1.1 버전</div>
        <div class="currency-container" style="margin-top: 5px;">
            <div class="coin-box"><span class="coin-icon">C</span> 코인: <span id="coin-count-shop">0</span>개</div>
            <div class="trophy-box">🏆 트로피: <span id="trophy-count-shop">0</span>개</div>
        </div>
        <div class="desc">공을 선택하거나 코인으로 구매하세요!</div>
        
        <div class="shop-list" id="shop-list-container">
            <!-- 자바스크립트로 동적 생성 -->
        </div>

        <button class="btn btn-back" id="btn-close-myball">로비로 돌아가기</button>
    </div>

    <!-- 1-1. 친구 플레이 메뉴 -->
    <div class="container hidden" id="friend-screen">
        <h2>👥 친구 플레이 👥</h2>
        <div class="version-text">v1.1 버전</div>
        <div class="currency-container">
            <div class="coin-box"><span class="coin-icon">C</span> 코인: <span id="coin-count-friend">0</span>개</div>
            <div class="trophy-box">🏆 트로피: <span id="trophy-count-friend">0</span>개</div>
        </div>
        <div class="desc">방을 생성하거나 번호를 입력하세요</div>
        <div class="error" id="friend-error"></div>
        
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn btn-create" style="margin-top:0; flex:1;" id="btn-create-room">방 생성하기 (랜덤 4자리)</button>
            <button class="btn" style="margin-top:0; width:40px; background:#c0392b;" id="btn-reset-room">X</button>
        </div>
        <div class="room-box hidden" id="room-display">----</div>

        <input type="text" id="room-input" placeholder="방 번호 4자리 입력" maxlength="4">
        <button class="btn btn-join" id="btn-join-room">방 번호로 시작하기</button>
        <button class="btn btn-back" id="btn-back-lobby">뒤로 가기</button>
    </div>

    <!-- 1-2. 캐릭터 선택 화면 -->
    <div class="container hidden" id="char-select-screen">
        <h2>⚔️ 출전 준비 ⚔️</h2>
        <div class="version-text">v1.1 버전</div>
        <div class="timer-box" id="timer-display">10초</div>
        <div class="desc" id="equipped-ball-desc">장착된 공으로 대결합니다!</div>
        <button class="btn btn-ai" id="btn-confirm-char">게임 시작</button>
    </div>

    <!-- 2. 게임 화면 -->
    <div class="container hidden" id="game-screen">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="340" height="340"></canvas>
            <button class="speed-btn" id="speed-toggle-btn">⚡ 2X 배속</button>
        </div>
        
        <div class="label" id="p1-label" style="color: #2980b9;">Player 1 (블루)</div>
        <div class="hp-bar">
            <div class="hp-fill" id="p1-hp"></div>
            <div class="hp-text" id="p1-hp-text">250 / 250</div>
        </div>

        <div class="label" id="p2-label" style="color: #c0392b;">Player 2 (레드)</div>
        <div class="hp-bar">
            <div class="hp-fill p2" id="p2-hp"></div>
            <div class="hp-text" id="p2-hp-text">250 / 250</div>
        </div>

        <div id="game-result-box" class="result-box hidden"></div>

        <button class="btn" id="lobby-back-btn" style="background:#d35400; margin-top:10px;">🏠 로비로 가기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;
        let createdCode = null;
        let remainingTime = 10;
        let timerInterval = null;
        let nextGameMode = 'ai';
        
        let userCoins = 0; 
        let userTrophies = 0;
        
        let isDoubleSpeed = false;
        let speedMultiplier = 1;

        let projectiles = [];
        let iceFallBlocks = [];

        let ballsData = [
            { id: 'standard', name: '스탠다드 볼', desc: '기본 공 (기본 장착)', price: 0, owned: true, equipped: true },
            { id: 'ice', name: '아이스 볼', desc: '1초마다 투사체 발사 & 5초마다 얼음 낙하 폭격', price: 10, owned: false, equipped: false }
        ];

        function saveData() {
            const gameData = {
                coins: userCoins,
                trophies: userTrophies,
                username: document.getElementById('username').value,
                balls: ballsData
            };
            localStorage.setItem('lily_ball_fight_data', JSON.stringify(gameData));
        }

        function loadData() {
            const saved = localStorage.getItem('lily_ball_fight_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.coins !== undefined) userCoins = parsed.coins;
                    if (parsed.trophies !== undefined) userTrophies = parsed.trophies;
                    if (parsed.username !== undefined) document.getElementById('username').value = parsed.username;
                    if (parsed.balls !== undefined && Array.isArray(parsed.balls)) {
                        ballsData = parsed.balls;
                    }
                } catch (e) {
                    console.error("데이터 로드 실패:", e);
                }
            }
        }

        let p1 = { 
            x: 85, y: 170, radius: 24, color: '#2980b9', vx: 2.2, vy: 1.6, hp: 250, maxHp: 250,
            type: 'standard', iceSkillGauge: 0, lastIceAttackTime: 0, freezeTimer: 0 
        };
        let p2 = { 
            x: 255, y: 170, radius: 24, color: '#c0392b', vx: -2.2, vy: -1.6, hp: 250, maxHp: 250,
            type: 'standard', iceSkillGauge: 0, lastIceAttackTime: 0, freezeTimer: 0 
        };

        function updateCoinsUI() {
            document.getElementById('coin-count').innerText = userCoins;
            document.getElementById('coin-count-friend').innerText = userCoins;
            document.getElementById('coin-count-shop').innerText = userCoins;
            document.getElementById('trophy-count').innerText = userTrophies;
            document.getElementById('trophy-count-friend').innerText = userTrophies;
            document.getElementById('trophy-count-shop').innerText = userTrophies;
        }

        function renderShop() {
            const listContainer = document.getElementById('shop-list-container');
            listContainer.innerHTML = '';

            ballsData.forEach(ball => {
                let itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item';
                if (ball.equipped) itemDiv.classList.add('equipped');
                else if (ball.owned) itemDiv.classList.add('owned');

                let infoDiv = document.createElement('div');
                infoDiv.className = 'shop-info';
                infoDiv.innerHTML = `<div class="shop-name">${ball.name}</div><div class="shop-desc">${ball.desc}</div>`;
                
                let btn = document.createElement('button');
                btn.className = 'shop-action-btn';

                if (ball.equipped) {
                    btn.className += ' btn-equipped';
                    btn.innerText = '장착 중';
                } else if (ball.owned) {
                    btn.className += ' btn-select';
                    btn.innerText = '선택하기';
                    bindElementTouch(btn, () => {
                        equipBall(ball.id);
                    });
                } else {
                    btn.className += ' btn-buy';
                    btn.innerText = `${ball.price} 코인으로 구매`;
                    bindElementTouch(btn, () => {
                        buyBall(ball.id);
                    });
                }

                itemDiv.appendChild(infoDiv);
                itemDiv.appendChild(btn);
                listContainer.appendChild(itemDiv);
            });
        }

        function buyBall(id) {
            let ball = ballsData.find(b => b.id === id);
            if (userCoins >= ball.price) {
                userCoins -= ball.price;
                ball.owned = true;
                equipBall(id);
                updateCoinsUI();
                renderShop();
                saveData();
                alert(`${ball.name} 구매 완료!`);
            } else {
                alert("코인이 부족합니다! (필요 코인: 10개)");
            }
        }

        function equipBall(id) {
            ballsData.forEach(b => b.equipped = (b.id === id));
            renderShop();
            saveData();
        }

        function getEquippedBall() {
            return ballsData.find(b => b.equipped) || ballsData[0];
        }

        function validateName() {
            document.activeElement.blur();
            const name = document.getElementById('username').value.trim();
            if (!name) {
                document.getElementById('error-msg').innerText = "이름부터 써주세요!";
                document.getElementById('friend-error').innerText = "이름부터 써주세요!";
                return null;
            }
            if (name.length > 10) {
                document.getElementById('error-msg').innerText = "10글자가 넘었습니다";
                document.getElementById('friend-error').innerText = "10글자가 넘었습니다";
                return null;
            }
            document.getElementById('error-msg').innerText = "";
            document.getElementById('friend-error').innerText = "";
            saveData();
            return name;
        }

        document.getElementById('username').addEventListener('input', function() {
            const val = this.value.trim();
            if (val.length > 10) {
                document.getElementById('error-msg').innerText = "10글자가 넘었습니다";
            } else {
                document.getElementById('error-msg').innerText = "";
            }
            saveData();
        });

        function startAI() {
            document.activeElement.blur();
            const name = validateName();
            if (!name) return;
            nextGameMode = 'ai';
            showCharacterSelect();
        }

        function joinRoomMatch() {
            document.activeElement.blur();
            const name = validateName();
            if (!name) return;

            const code = document.getElementById('room-input').value.trim();
            const err = document.getElementById('friend-error');

            if (createdCode && code === createdCode) {
                err.innerText = "자신과 싸울수 없습니다";
                return;
            }

            if (code.length !== 4 || !createdCode || code !== createdCode) {
                err.innerText = "비번이 틀렸습니다";
                return;
            }

            err.innerText = "";
            nextGameMode = 'friend';
            showCharacterSelect();
        }

        function showCharacterSelect() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('friend-screen').classList.add('hidden');
            document.getElementById('myball-screen').classList.add('hidden');
            document.getElementById('char-select-screen').classList.remove('hidden');

            let equipped = getEquippedBall();
            document.getElementById('equipped-ball-desc').innerText = `현재 장착 공: [ ${equipped.name} ]`;

            remainingTime = 10;
            document.getElementById('timer-display').innerText = remainingTime + "초";
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingTime--;
                document.getElementById('timer-display').innerText = remainingTime + "초";
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    confirmCharacterSelection();
                }
            }, 1000);
        }

        function confirmCharacterSelection() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            const name = document.getElementById('username').value.trim();
            let equipped = getEquippedBall();
            document.getElementById('p1-label').innerText = `${name} (${equipped.name}) (블루)`;

            if (nextGameMode === 'ai') {
                document.getElementById('p2-label').innerText = "AI 봇 (스탠다드 볼) (레드)";
            } else {
                document.getElementById('p2-label').innerText = "친구 (스탠다드 볼) (레드)";
            }

            resetGameState();
            gameStarted = true;
            requestAnimationFrame(loop);
        }

        function toggleSpeed() {
            if (!gameStarted) return;

            if (nextGameMode === 'friend') {
                const confirmChoice = confirm("⚡ 친구에게 2배속 요청이 들어왔습니다.\n승인하시겠습니까?");
                if (!confirmChoice) {
                    alert("2배속 요청이 거절되었습니다.");
                    return;
                }
            }

            isDoubleSpeed = !isDoubleSpeed;
            const btn = document.getElementById('speed-toggle-btn');

            if (isDoubleSpeed) {
                speedMultiplier = 2;
                btn.innerText = "⚡ 2X 온 (ON)";
                btn.classList.add('active');
            } else {
                speedMultiplier = 1;
                btn.innerText = "⚡ 2X 배속";
                btn.classList.remove('active');
            }
        }

        function showFriendMenu() {
            document.activeElement.blur();
            const name = validateName();
            if (!name) return;

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('friend-screen').classList.remove('hidden');
        }

        function showMyBallShop() {
            document.activeElement.blur();
            document.getElementById('lobby-screen').classList.add('hidden');
            renderShop();
            document.getElementById('myball-screen').classList.remove('hidden');
        }

        function showLobby() {
            if (timerInterval) clearInterval(timerInterval);
            gameStarted = false;
            resetGameState();
            updateCoinsUI();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('friend-screen').classList.add('hidden');
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('myball-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        function createRoom() {
            document.activeElement.blur();
            createdCode = Math.floor(1000 + Math.random() * 9000).toString();
            const box = document.getElementById('room-display');
            box.innerText = "방 번호: " + createdCode;
            box.classList.remove('hidden');
            document.getElementById('friend-error').innerText = "";
        }

        function resetRoom() {
            document.activeElement.blur();
            createdCode = null;
            document.getElementById('room-display').classList.add('hidden');
            document.getElementById('room-input').value = "";
            document.getElementById('friend-error').innerText = "방이 초기화되었습니다.";
        }

        function joinRoom() {
            joinRoomMatch();
        }

        function resetGameState() {
            p1.hp = 250; p2.hp = 250;
            p1.x = 85; p1.y = 170; p1.vx = 2.2; p1.vy = 1.6;
            p2.x = 255; p2.y = 170; p2.vx = -2.2; p2.vy = -1.6;

            let equipped = getEquippedBall();
            p1.type = equipped.id; 
            p1.iceSkillGauge = 0;
            p1.lastIceAttackTime = Date.now();
            p1.freezeTimer = 0;

            p2.type = 'standard';
            p2.iceSkillGauge = 0;
            p2.freezeTimer = 0;

            projectiles = [];
            iceFallBlocks = [];
            
            isDoubleSpeed = false;
            speedMultiplier = 1;
            const btn = document.getElementById('speed-toggle-btn');
            btn.innerText = "⚡ 2X 배속";
            btn.classList.remove('active');

            document.getElementById('p1-hp').style.width = '100%';
            document.getElementById('p2-hp').style.width = '100%';
            document.getElementById('p1-hp-text').innerText = "250 / 250";
            document.getElementById('p2-hp-text').innerText = "250 / 250";
            
            const resBox = document.getElementById('game-result-box');
            resBox.className = "result-box hidden";
            resBox.innerText = "";
        }

        function checkGameOver() {
            if (p1.hp <= 0 || p2.hp <= 0) {
                gameStarted = false;
                const resBox = document.getElementById('game-result-box');
                resBox.classList.remove('hidden');

                if (p1.hp > 0 && p2.hp <= 0) {
                    userCoins += 1;
                    userTrophies += 1;
                    updateCoinsUI();
                    saveData();
                    resBox.className = "result-box result-win";
                    resBox.innerText = "🎉 WIN! (+1 코인 / +1 트로피)";
                } else if (p1.hp <= 0 && p2.hp > 0) {
                    resBox.className = "result-box result-lose";
                    resBox.innerText = "💀 LOSE";
                } else {
                    resBox.className = "result-box result-draw";
                    resBox.innerText = "🤝 무승부!";
                }
            }
        }

        function triggerIceUltimate(owner) {
            let target = (owner === p1) ? p2 : p1;
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    if (!gameStarted) return;
                    let startX = 50 + i * 80;
                    iceFallBlocks.push({
                        x: startX,
                        y: -60,
                        size: 55,
                        speed: 5 * speedMultiplier,
                        damage: 20,
                        target: target
                    });
                }, i * 350);
            }
        }

        function update() {
            if (!gameStarted) return;

            if (p1.freezeTimer > 0) {
                p1.freezeTimer -= speedMultiplier;
            } else {
                p1.x += p1.vx * speedMultiplier; 
                p1.y += p1.vy * speedMultiplier;
                if (p1.x - p1.radius < 0 || p1.x + p1.radius > canvas.width) p1.vx *= -1;
                if (p1.y - p1.radius < 0 || p1.y + p1.radius > canvas.height) p1.vy *= -1;
            }

            if (p2.freezeTimer > 0) {
                p2.freezeTimer -= speedMultiplier;
            } else {
                p2.x += p2.vx * speedMultiplier; 
                p2.y += p2.vy * speedMultiplier;
                if (p2.x - p2.radius < 0 || p2.x + p2.radius > canvas.width) p2.vx *= -1;
                if (p2.y - p2.radius < 0 || p2.y + p2.radius > canvas.height) p2.vy *= -1;
            }

            if (p1.type === 'ice') {
                p1.iceSkillGauge += (1 / 300) * speedMultiplier;
                if (p1.iceSkillGauge >= 1) {
                    p1.iceSkillGauge = 0;
                    triggerIceUltimate(p1);
                }

                let now = Date.now();
                if (now - p1.lastIceAttackTime >= 1000 / speedMultiplier) {
                    p1.lastIceAttackTime = now;
                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    projectiles.push({
                        x: p1.x,
                        y: p1.y,
                        vx: (dx / dist) * 6 * speedMultiplier,
                        vy: (dy / dist) * 6 * speedMultiplier,
                        radius: 8,
                        target: p2,
                        damage: 10
                    });
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let proj = projectiles[i];
                proj.x += proj.vx;
                proj.y += proj.vy;

                if (proj.x < 0 || proj.x > canvas.width || proj.y < 0 || proj.y > canvas.height) {
                    projectiles.splice(i, 1);
                    continue;
                }

                let dx = proj.target.x - proj.x;
                let dy = proj.target.y - proj.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < proj.target.radius + proj.radius) {
                    proj.target.hp = Math.max(0, proj.target.hp - proj.damage);
                    projectiles.splice(i, 1);
                    updateHpBars();
                    checkGameOver();
                }
            }

            for (let i = iceFallBlocks.length - 1; i >= 0; i--) {
                let ice = iceFallBlocks[i];
                ice.y += ice.speed;

                let dx = ice.target.x - ice.x;
                let dy = ice.target.y - ice.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < ice.target.radius + ice.size / 2.5) {
                    ice.target.hp = Math.max(0, ice.target.hp - ice.damage);
                    ice.target.freezeTimer = 90;
                    iceFallBlocks.splice(i, 1);
                    updateHpBars();
                    checkGameOver();
                    continue;
                }

                if (ice.y > canvas.height + 80) {
                    iceFallBlocks.splice(i, 1);
                }
            }

            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < p1.radius + p2.radius) {
                let tempVx = p1.vx; let tempVy = p1.vy;
                p1.vx = p2.vx; p1.vy = p2.vy;
                p2.vx = tempVx; p2.vy = tempVy;

                let overlap = (p1.radius + p2.radius) - dist;
                let nx = dx / (dist || 1);
                let ny = dy / (dist || 1);
                p1.x -= nx * overlap / 2;
                p1.y -= ny * overlap / 2;
                p2.x += nx * overlap / 2;
                p2.y += ny * overlap / 2;

                p1.hp = Math.max(0, p1.hp - 30);
                p2.hp = Math.max(0, p2.hp - 30);

                updateHpBars();
                checkGameOver();
            }
        }

        function updateHpBars() {
            document.getElementById('p1-hp').style.width = (p1.hp / p1.maxHp * 100) + '%';
            document.getElementById('p1-hp-text').innerText = p1.hp + " / " + p1.maxHp;

            document.getElementById('p2-hp').style.width = (p2.hp / p2.maxHp * 100) + '%';
            document.getElementById('p2-hp-text').innerText = p2.hp + " / " + p2.maxHp;
        }

        function drawPlayer(p) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);

            if (p.type === 'ice') {
                ctx.fillStyle = '#0984e3';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#74b9ff';
                ctx.stroke();

                if (p.iceSkillGauge > 0) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 4, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * p.iceSkillGauge));
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#f1c40f';
                    ctx.stroke();
                }
            } else {
                ctx.fillStyle = p.color;
                ctx.fill();
            }
            ctx.closePath();

            if (p.freezeTimer > 0) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius + 7, 0, Math.PI * 2);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00cec9';
                ctx.stroke();
                ctx.closePath();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPlayer(p1);
            drawPlayer(p2);

            projectiles.forEach(proj => {
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#0984e3';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.closePath();
            });

            iceFallBlocks.forEach(ice => {
                ctx.save();
                ctx.translate(ice.x, ice.y);
                ctx.fillStyle = '#74b9ff';
                ctx.strokeStyle = '#0984e3';
                ctx.lineWidth = 3;
                ctx.fillRect(-ice.size / 2, -ice.size / 2, ice.size, ice.size);
                ctx.strokeRect(-ice.size / 2, -ice.size / 2, ice.size, ice.size);
                ctx.restore();
            });
        }

        function loop() {
            if (!gameStarted) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function bindElementTouch(el, handler) {
            if (!el) return;
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                handler();
            }, { passive: false });
            el.addEventListener('click', handler);
        }

        bindElementTouch(document.getElementById('btn-ai-match'), startAI);
        bindElementTouch(document.getElementById('btn-friend-play'), showFriendMenu);
        bindElementTouch(document.getElementById('btn-open-myball'), showMyBallShop);
        bindElementTouch(document.getElementById('btn-close-myball'), showLobby);
        bindElementTouch(document.getElementById('btn-create-room'), createRoom);
        bindElementTouch(document.getElementById('btn-reset-room'), resetRoom);
        bindElementTouch(document.getElementById('btn-join-room'), joinRoom);
        bindElementTouch(document.getElementById('btn-back-lobby'), showLobby);
        bindElementTouch(document.getElementById('btn-confirm-char'), confirmCharacterSelection);
        bindElementTouch(document.getElementById('speed-toggle-btn'), toggleSpeed);
        bindElementTouch(document.getElementById('lobby-back-btn'), showLobby);

        loadData();
        updateCoinsUI();
    </script>
</body>
</html>
