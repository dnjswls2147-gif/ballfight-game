<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공싸움 게임 로비</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #333;
            box-sizing: border-box;
            padding-bottom: 30px;
        }

        /* 상단 아이콘 및 타이틀 바 */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            box-sizing: border-box;
        }
        .top-left-icons, .top-right-icons {
            display: flex;
            gap: 16px;
            font-size: 20px;
            color: #555;
        }
        .creator-text {
            font-size: 14px;
            color: #888;
            font-weight: bold;
        }

        /* 메인 컨텐츠 영역 */
        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }

        /* 로비 메인 박스 (내부 요소 삭제 후 깔끔한 상자) */
        .lobby-box {
            position: relative;
            width: 340px;
            height: 380px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .start-btn {
            width: 340px;
            padding: 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #27ae60;
            margin-top: 25px;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #27ae60;
        }

        /* 게임 플레이 화면 스타일 */
