
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #f0f3f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        .screen {
            width: 100%;
            max-width: 360px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hidden { display: none !important; }
        .welcome-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }
        .lobby-box {
            width: 100%;
            height: 180px;
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #7f8c8d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .start-btn {
            width: 100%;
            padding: 14px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #27ae60;
            margin-top: 15px;
        }
        #game-container {
            width: 300px;
            height: 300px;
            background: #ffffff;
            border: 4px solid #2c3e50;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        canvas { display: block; }
        .ui-container {
            width: 300px;
            margin-top: 15px;
        }
        .hp-bar-wrapper { margin-bottom: 8px; }
        .hp-label { font-size: 13px; font-weight: bold; margin-bottom: 3px; }
        .hp-bg {
            width: 100%; height: 16px;
            background: #e0e0e0; border-radius: 8px;
            overflow: hidden; border: 2px solid #2c3e50;
        }
        .hp-fill { height: 100%; width: 100%; transition: width 0.1s; }
        #p1-hp { background-color: #e74c3c; }
        #p2-hp { background-color: #3498db; }
    </style>
</head>
