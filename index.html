    <title>릴리 볼 파이트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f0f3f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hidden { display: none !important; }
        
        /* 로비 스타일 */
        .welcome-title {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .lobby-box {
            width: 320px;
            height: 200px;
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #7f8c8d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .start-btn {
            width: 320px;
            padding: 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #27ae60;
            margin-top: 20px;
            transition: transform 0.1s;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #27ae60;
        }

            height: 340px;
            background: #ffffff;
            border: 4px solid #2c3e50;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        }

            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
