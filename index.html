<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>릴리 볼 파이트</title>

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hidden { display: none !important; }
        .welcome-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }
        .lobby-box {
            width: 340px;
            height: 340px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .start-btn {
            width: 340px;
            padding: 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #27ae60;
            margin-top: 25px;
        }
        #game-screen {
            background-color: #111;
            color: white;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
        }
        #game-container {
            position: relative;
            width: 380px; height: 380px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 10px;
            overflow: hidden;
        }
        canvas { display: block; }
        .ui-container {
            width: 380px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-status {
            background: #222;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .player-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .hp-bar-bg {
            width: 100%; height: 12px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
        }

        #p2-hp { background: #e74c3c; }
