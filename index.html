<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #f0f3f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        .screen {
            width: 100%;
            max-width: 360px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hidden { display: none !important; }
        .welcome-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 12px;
            text-align: center;
        }
        .lobby-box {
            width: 100%;
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .lobby-desc {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 12px;
            text-align: center;
        }
        /* 이름 입력창 스타일 */
        .name-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: center;
            margin-bottom: 10px;
        }
        .name-input:focus {
            border-color: #2ecc71;
        }
        /* 경고 메시지 스타일 */
        #error-msg {
            height: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 8px;
            text-align: center;
        }
        .start-btn {
            width: 100%;
            padding: 14px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #27ae60;
            margin-top: 5px;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #27ae60;
        }
        #game-container {
            width: 300px;
            height: 300px;
            background: #ffffff;
            border: 4px solid #2c3e50;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        canvas { display: block; }
        .ui-container {
            width: 300px;
            margin-top: 15px;
        }
        .hp-bar-wrapper { margin-bottom: 8px; }
        .hp-label { font-size: 13px; font-weight: bold; margin-bottom: 3px; }
        .hp-bg {
            width: 100%; height: 16px;
            background: #e0e0e0; border-radius: 8px;
            overflow: hidden; border: 2px solid #2c3e50;
        }
        .hp-fill { height: 100%; width: 100%; transition: width 0.1s; }
        #p1-hp { background-color: #e74c3c; }
        #p2-hp { background-color: #3498db; }
    </style>
</head>
<body>

    <!-- 배경음악 오디오 태그 -->
    <audio id="bgm" loop preload="auto">
        <source src="https://actions.google.com/sounds/v1/science_fiction/arcade_game_loop.ogg" type="audio/ogg">
    </audio>

    <!-- 1. 로비 화면 -->
    <div id="lobby-screen" class="screen">
        <div class="welcome-title">🎮 릴리 볼 파이트 🎮</div>
        <div class="lobby-box">
            <div class="lobby-desc">플레이어 이름을 입력하세요!</div>
            <!-- 에러 메시지 표시 영역 -->
            <div id="error-msg"></div>
            <!-- 이름 입력 텍스트 박스 -->
            <input type="text" id="username" class="name-input" placeholder="이름을 입력하세요" maxlength="10">
        </div>
        <button class="start-btn" onclick="startGame()">게임 시작하기</button>
    </div>

    <!-- 2. 게임 화면 -->
    <div id="game-screen" class="screen hidden">
        <div id="game-container">
            <canvas id="gameCanvas" width="300" height="300"></canvas>
        </div>
        <div class="ui-container">
            <div class="hp-bar-wrapper">
                <div id="p1-label" class="hp-label" style="color: #e74c3c;">Player 1 (레드)</div>
                <div class="hp-bg"><div id="p1-hp" class="hp-fill"></div></div>
            </div>
            <div class="hp-bar-wrapper">
                <div class="hp-label" style="color: #3498db;">Player 2 (AI 블루)</div>
                <div class="hp-bg"><div id="p2-hp" class="hp-fill"></div></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgm = document.getElementById('bgm');

        let gameStarted = false;
        let p1 = { x: 70, y: 150, radius: 14, color: '#e74c3c', vx: 3.5, vy: 2.5, hp: 100, maxHp: 100 };
        let p2 = { x: 230, y: 150, radius: 14, color: '#3498db', vx: -3.5, vy: -2.5, hp: 100, maxHp: 100 };

        function startGame() {
            const nameInput = document.getElementById('username').value.trim();
            const errorMsg = document.getElementById('error-msg');

            // 이름을 입력하지 않았을 때 검사
            if (nameInput === "") {
                errorMsg.innerText = "이름부터 써주세요!";
                return; // 게임 시작 막기
            }

            // 에러 메시지 초기화 및 음악 재생
            errorMsg.innerText = "";
            bgm.volume = 1.0;
            bgm.play().catch(e => console.log("음악 재생 차단됨:", e));

            // 입력한 이름을 P1 레이블에 반영
            document.getElementById('p1-label').innerText = nameInput + " (레드)";

            // 화면 전환
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            gameStarted = true;
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (!gameStarted) return;

            p1.x += p1.vx; p1.y += p1.vy;
            p2.x += p2.vx; p2.y += p2.vy;

            if (p1.x - p1.radius < 0 || p1.x + p1.radius > canvas.width) p1.vx *= -1;
            if (p1.y - p1.radius < 0 || p1.y + p1.radius > canvas.height) p1.vy *= -1;

            if (p2.x - p2.radius < 0 || p2.x + p2.radius > canvas.width) p2.vx *= -1;
            if (p2.y - p2.radius < 0 || p2.y + p2.radius > canvas.height) p2.vy *= -1;

            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < p1.radius + p2.radius) {
                let tempVx = p1.vx; let tempVy = p1.vy;
                p1.vx = p2.vx; p1.vy = p2.vy;
                p2.vx = tempVx; p2.vy = tempVy;

                let overlap = (p1.radius + p2.radius) - dist;
                let nx = dx / (dist || 1);
                let ny = dy / (dist || 1);
                p1.x -= nx * overlap / 2;
                p1.y -= ny * overlap / 2;
                p2.x += nx * overlap / 2;
                p2.y += ny * overlap / 2;

                p1.hp = Math.max(0, p1.hp - 10);
                p2.hp = Math.max(0, p2.hp - 10);

                document.getElementById('p1-hp').style.width = (p1.hp / p1.maxHp * 100) + '%';
                document.getElementById('p2-hp').style.width = (p2.hp / p2.maxHp * 100) + '%';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
            ctx.fillStyle = p1.color;
            ctx.fill();
            ctx.closePath();

            ctx.beginPath();
            ctx.arc(p2.x, p2.y, p2.radius, 0, Math.PI * 2);
            ctx.fillStyle = p2.color;
            ctx.fill();
            ctx.closePath();
        }

        function gameLoop() {
            if (!gameStarted) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
