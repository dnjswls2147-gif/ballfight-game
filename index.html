<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공싸움 게임</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        #game-container {
            position: relative;
            width: 380px;
            height: 380px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .ui-container {
            width: 380px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-status {
            background: #222;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .player-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .hp-bar-bg {
            width: 100%;
            height: 12px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
        }
        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s ease;
        }
        #p1-hp { background: #2ecc71; }
        #p2-hp { background: #e74c3c; }
        #exit-btn {
            margin-top: 10px;
            width: 380px;
            padding: 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #c0392b;
        }
        #exit-btn:active {
            box-shadow: 0 2px #c0392b;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="380" height="380"></canvas>
    </div>

    <div class="ui-container">
        <div class="player-status">
            <div class="player-name">
                <span style="color: #3498db;">어둠속성 김켈리</span>
                <span id="p1-hp-text">250 / 250</span>
            </div>
            <div class="hp-bar-bg">
                <div id="p1-hp" class="hp-bar-fill"></div>
            </div>
        </div>

        <div class="player-status">
            <div class="player-name">
                <span style="color: #e74c3c;">백기철 판타지</span>
                <span id="p2-hp-text">250 / 250</span>
            </div>
            <div class="hp-bar-bg">
                <div id="p2-hp" class="hp-bar-fill"></div>
            </div>
        </div>
    </div>

    <button id="exit-btn">나가기 🚪</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const player1 = {
            x: 120, y: 190, vx: 1.8, vy: 2,
            radius: 22, auraRadius: 75,
            hp: 250, maxHp: 250, color: '#3498db'
        };

        const player2 = {
            x: 260, y: 190, vx: -1.8, vy: -2,
            radius: 22, auraRadius: 75,
            hp: 250, maxHp: 250, color: '#e74c3c'
        };

        function updateGame() {
            player1.x += player1.vx;
            player1.y += player1.vy;
            player2.x += player2.vx;
            player2.y += player2.vy;

            if (player1.x - player1.auraRadius < 0 || player1.x + player1.auraRadius > canvas.width) player1.vx *= -1;
            if (player1.y - player1.auraRadius < 0 || player1.y + player1.auraRadius > canvas.height) player1.vy *= -1;

            if (player2.x - player2.auraRadius < 0 || player2.x + player2.auraRadius > canvas.width) player2.vx *= -1;
            if (player2.y - player2.auraRadius < 0 || player2.y + player2.auraRadius > canvas.height) player2.vy *= -1;

            const dx = player1.x - player2.x;
            const dy = player1.y - player2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < player1.auraRadius + player2.auraRadius) {
                if (player1.hp > 0) player1.hp -= 0.3;
                if (player2.hp > 0) player2.hp -= 0.3;
            }

            document.getElementById('p1-hp').style.width = Math.max(0, (player1.hp / player1.maxHp) * 100) + '%';
            document.getElementById('p1-hp-text').innerText = Math.ceil(player1.hp) + ' / ' + player1.maxHp;

            document.getElementById('p2-hp').style.width = Math.max(0, (player2.hp / player2.maxHp) * 100) + '%';
            document.getElementById('p2-hp-text').innerText = Math.ceil(player2.hp) + ' / ' + player2.maxHp;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(player1.x, player1.y, player1.auraRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(52, 152, 219, 0.15)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#3498db';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(player1.x, player1.y, player1.radius, 0, Math.PI * 2);
            ctx.fillStyle = player1.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(player2.x, player2.y, player2.auraRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(231, 76, 60, 0.15)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#e74c3c';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(player2.x, player2.y, player2.radius, 0, Math.PI * 2);
            ctx.fillStyle = player2.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        }

        function loop() {
            updateGame();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        // --- 배경음악 및 나가기 버튼 추가 기능 ---
        const bgm = new Audio('bgm.mp3');
        bgm.loop = true;
        window.addEventListener('click', () => {
            bgm.play();
        }, { once: true });

        document.getElementById('exit-btn').addEventListener('click', () => {
            alert('로비로 나갑니다!');
            location.reload();
        });
    </script>
</body>
</html>
